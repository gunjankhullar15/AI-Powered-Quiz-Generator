  <!-- Main Content -->
  <div class="main-content">
    <h1 class="page-title">TEST HISTORY</h1>

    <!-- Filters and Actions Bar -->
    <div class="filters-bar">
      <div class="search-container">
        <mat-form-field appearance="outline" class="search-field">
          <mat-icon matPrefix>search</mat-icon>
          <input matInput 
                 placeholder="Search" 
                 [(ngModel)]="searchText"
                 (keyup)="applyFilter()">
        </mat-form-field>
      </div>

      <div class="filter-actions">
        <mat-form-field appearance="outline" class="filter-select date-filter">
          <mat-label>Creation Date</mat-label>
          <input matInput 
                 [matDatepicker]="creationPicker" 
                 [(ngModel)]="selectedCreationDate"
                 (dateChange)="applyFilter()">
          <mat-datepicker-toggle matSuffix [for]="creationPicker"></mat-datepicker-toggle>
          <mat-datepicker #creationPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" class="filter-select date-filter">
          <mat-label>Due Date</mat-label>
          <input matInput 
                 [matDatepicker]="duePicker" 
                 [(ngModel)]="selectedDueDate"
                 (dateChange)="applyFilter()">
          <mat-datepicker-toggle matSuffix [for]="duePicker"></mat-datepicker-toggle>
          <mat-datepicker #duePicker></mat-datepicker>
        </mat-form-field>

        <button mat-raised-button 
                color="warn" 
                class="create-btn"
                (click)="createNewTest()">
          <mat-icon>add</mat-icon>
          CREATE NEW TEST
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table mat-table [dataSource]="dataSource" class="test-history-table">
        
        <!-- S.No Column -->
        <ng-container matColumnDef="sNo">
          <th mat-header-cell *matHeaderCellDef>S.No.</th>
          <td mat-cell *matCellDef="let element">{{element.sNo}}</td>
        </ng-container>

        <!-- Test ID Column -->
        <ng-container matColumnDef="testId">
          <th mat-header-cell *matHeaderCellDef>Test ID</th>
          <td mat-cell *matCellDef="let element">{{element.testId}}</td>
        </ng-container>

        <!-- Test Name Column -->
        <ng-container matColumnDef="testname">
          <th mat-header-cell *matHeaderCellDef>Test Name</th>
          <td mat-cell *matCellDef="let element">{{element.testname}}</td>
        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let element">{{element.description}}</td>
        </ng-container>

        <!-- Creation Date Column -->
        <ng-container matColumnDef="creationdate">
          <th mat-header-cell *matHeaderCellDef>Creation Date</th>
          <td mat-cell *matCellDef="let element">{{element.creationdate}}</td>
        </ng-container>

        <!-- Due Date Column -->
        <ng-container matColumnDef="duedate">
          <th mat-header-cell *matHeaderCellDef>Due Date</th>
          <td mat-cell *matCellDef="let element">{{element.duedate}}</td>
        </ng-container>

<ng-container matColumnDef="testlink">
  <th mat-header-cell *matHeaderCellDef>Test Link</th>
  <td mat-cell *matCellDef="let element" class="test-link-cell">
    <span class="link-text-wrapper">
      <a [href]="element.testlink" target="_blank" class="test-link" [title]="element.testlink">
        {{element.testlink}}
      </a>
    </span>
    <button mat-icon-button 
            (click)="copyTestLink(element.testlink, $event)" 
            matTooltip="Copy link"
            class="copy-btn">
      <mat-icon>content_copy</mat-icon>
    </button>
  </td>
</ng-container>



        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row 
            *matRowDef="let row; columns: displayedColumns;"
            [class]="getRowClass(row)"
            (click)="onRowClick(row)">
        </tr>
      </table>
      
      <mat-paginator class="paginator" [pageSizeOptions]="[5, 10, 25, 50]"
                     showFirstLastButtons>
      </mat-paginator>
    </div>
  </div> 

  <!-- Footer -->
  <div class="footer dashboard-footer">
    <p>Powered by BYT strategy group</p>
  </div>
