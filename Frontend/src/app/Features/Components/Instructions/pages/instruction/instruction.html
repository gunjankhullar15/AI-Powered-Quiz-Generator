<!-- HTML Structure -->
<div class="instructions-page">
  <!-- Navbar at top -->
  <!-- <app-navbar></app-navbar> -->


  <app-user-navbar></app-user-navbar>

  <!-- Main Content Area with gray background -->
  <div class="main-wrapper">
    <div class="content-card">
      <!-- Header with title and button -->
      <div class="content-header">
        <h2 class="page-title">INSTRUCTIONS</h2>
        <button class="start-btn" (click)="onStartTest()" [disabled]="loading || !instructionsText">
          START TEST
        </button>
      </div>

      <!-- Loading State -->
      <div *ngIf="loading" class="loading-state">
        <div class="spinner"></div>
        <p>Loading instructions...</p>
      </div>

      <!-- Error State -->
      <div *ngIf="error && !loading" class="error-state">
        <div class="error-icon">!</div>
        <p>{{ error }}</p>
        <button class="retry-btn" (click)="fetchInstructions()">Retry</button>
      </div>

      <!-- Instructions Content -->
      <div *ngIf="!loading && !error && formattedInstructions" class="instructions-content" [innerHTML]="formattedInstructions"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>Powered by BYT strategy group</p>
  </footer>
</div>
